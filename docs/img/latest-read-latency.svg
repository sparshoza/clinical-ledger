<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
<title id="t">Reading the latest version stays flat as history grows</title>
<desc id="d">Median milliseconds to read the latest version of a record with 1, 100 and 10,000 versions, for a head lookup and a full read. The full table is in docs/benchmarks.md.</desc>
<style>
svg{--surface:#ffffff;--ink:#15222b;--ink-2:#4a5d68;--grid:#dde5e0;--axis:#9fb0a6;--s1:#1c4c9c;--s2:#2f9a5a;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#0d1117;--ink:#e6edf3;--ink-2:#a9b6c1;--grid:#26313a;--axis:#4b5a65;--s1:#4f86d9;--s2:#2f9e5f}}
.bg{fill:var(--surface)}.title{fill:var(--ink);font-size:16px;font-weight:600}
.sub,.tick,.value,.legend{fill:var(--ink-2);font-size:12px}
.group{fill:var(--ink);font-size:12px}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.bar.s1{fill:var(--s1)}.bar.s2{fill:var(--s2)}
.sw.s1{fill:var(--s1)}.sw.s2{fill:var(--s2)}
.value{font-variant-numeric:tabular-nums}
</style>
<rect class="bg" width="640" height="340" rx="8"/>
<text class="title" x="16" y="28">Reading the latest version stays flat as history grows</text>
<text class="sub" x="16" y="48">Median milliseconds, one client, 2,000 reads per bar</text>
<rect class="sw s1" x="16.0" y="62" width="12" height="12" rx="2"/>
<text class="legend" x="34.0" y="72">Head lookup</text>
<rect class="sw s2" x="142.0" y="62" width="12" height="12" rx="2"/>
<text class="legend" x="160.0" y="72">Full read</text>
<line class="axis" x1="56" y1="296.0" x2="624" y2="296.0"/>
<text class="tick" x="48" y="300.0" text-anchor="end">0</text>
<line class="grid" x1="56" y1="245.0" x2="624" y2="245.0"/>
<text class="tick" x="48" y="249.0" text-anchor="end">0.25</text>
<line class="grid" x1="56" y1="194.0" x2="624" y2="194.0"/>
<text class="tick" x="48" y="198.0" text-anchor="end">0.5</text>
<line class="grid" x1="56" y1="143.0" x2="624" y2="143.0"/>
<text class="tick" x="48" y="147.0" text-anchor="end">0.75</text>
<line class="grid" x1="56" y1="92.0" x2="624" y2="92.0"/>
<text class="tick" x="48" y="96.0" text-anchor="end">1</text>
<path class="bar s1" d="M125.7,296.0 V253.9 Q125.7,249.9 129.7,249.9 H145.7 Q149.7,249.9 149.7,253.9 V296.0 Z"><title>1 versions, head lookup: 0.23 ms median</title></path>
<text class="value" x="137.7" y="243.9" text-anchor="middle">0.23</text>
<path class="bar s2" d="M151.7,296.0 V116.8 Q151.7,112.8 155.7,112.8 H171.7 Q175.7,112.8 175.7,116.8 V296.0 Z"><title>1 versions, full read: 0.90 ms median</title></path>
<text class="value" x="163.7" y="106.8" text-anchor="middle">0.90</text>
<text class="group" x="150.7" y="318" text-anchor="middle">1 version</text>
<path class="bar s1" d="M315.0,296.0 V253.5 Q315.0,249.5 319.0,249.5 H335.0 Q339.0,249.5 339.0,253.5 V296.0 Z"><title>100 versions, head lookup: 0.23 ms median</title></path>
<text class="value" x="327.0" y="243.5" text-anchor="middle">0.23</text>
<path class="bar s2" d="M341.0,296.0 V109.3 Q341.0,105.3 345.0,105.3 H361.0 Q365.0,105.3 365.0,109.3 V296.0 Z"><title>100 versions, full read: 0.94 ms median</title></path>
