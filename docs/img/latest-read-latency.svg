<text class="group" x="340.0" y="318" text-anchor="middle">100 versions</text>
<path class="bar s1" d="M504.3,296.0 V265.7 Q504.3,261.7 508.3,261.7 H524.3 Q528.3,261.7 528.3,265.7 V296.0 Z"><title>10,000 versions, head lookup: 0.17 ms median</title></path>
